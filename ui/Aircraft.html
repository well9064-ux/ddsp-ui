<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>기체 관리 · 드론 파종 컨셉 UI</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">
<style>body{margin:0;background:#FFFFFF} a{text-decoration:none}
.dc-back{position:fixed;left:24px;bottom:24px;z-index:9999;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;background:#231F20;color:#FFFFFF;font:600 14px Pretendard,system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.dc-back:hover{background:#EF4122} .dc-back:focus-visible{outline:2px solid #EF4122;outline-offset:3px}</style>
<script src="../lib/morphdom.js"></script>

</head>
<body>
<div id="dc-root"></div>
<a class="dc-back" href="../index.html" aria-label="설계 산출물 목차로 돌아가기">← 목차로</a>
<script type="text/x-dc-template" id="dc-tpl">
<helmet>
<style>
body{margin:0}
a{color:#0070C0;text-decoration:none}a:hover{color:#025996}
</style>
</helmet>
<div style="min-height: 1000px; display: flex; background: #FFFFFF; font-family: var(--font-primary); color: #222222; font-variant-numeric: tabular-nums;">

  <div style="flex: 0 0 230px; display: flex;">
    <dc-import name="Nav" active="aircraft" hint-size="230px,1000px"></dc-import>
  </div>

  <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;">
    <header style="height: 50px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: #231F20; color: #FFFFFF;">
      <span style="font-size: 13px; font-weight: 600;">2027년 4월 12일</span>
      <div style="flex-grow: 1;"></div>
      <span style="font-size: 13px; font-weight: 600;">안녕하세요, 관리자 님</span>
    </header>

    <main style="flex: 1 1 auto; box-sizing: border-box; padding: 18px 16px 32px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #DDDDDD;">
        <h1 style="margin: 0; font-size: 18px; font-weight: 800;">기체 관리</h1>
        <div style="flex-grow: 1;"></div>
        <span style="font-size: 12px; color: #888888;">드론 정밀진단 › <b style="color: #333333;">기체 관리</b></span>
      </div>

      <form role="search" aria-label="기체 검색" style="padding: 12px 16px; background: #F5F5F5; border: 1px solid #E2E2E2; display: grid; grid-template-columns: 90px 1fr; gap: 9px 10px; align-items: center; font-size: 12px;">
        <span style="font-weight: 700;">소유 구분</span>
        <div style="display: flex; align-items: center; gap: 40px;">
          <div style="display: flex;">
            <span style="height: 28px; padding: 0 14px; display: inline-flex; align-items: center; background: #FFFFFF; border: 2px solid #222222; font-weight: 700;">전체</span>
            <span style="height: 28px; padding: 0 14px; margin-left: -1px; display: inline-flex; align-items: center; background: #FFFFFF; border: 1px solid #CCCCCC;">법인</span>
            <span style="height: 28px; padding: 0 14px; margin-left: -1px; display: inline-flex; align-items: center; background: #FFFFFF; border: 1px solid #CCCCCC;">농민</span>
            <span style="height: 28px; padding: 0 14px; margin-left: -1px; display: inline-flex; align-items: center; background: #FFFFFF; border: 1px solid #CCCCCC;">실증 운영자</span>
          </div>
          <span style="display: flex; align-items: center; gap: 24px;"><span style="font-weight: 700;">기종</span><span style="width: 260px; height: 28px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: #FFFFFF; border: 1px solid #CCCCCC;">전체 <span aria-hidden="true">⌄</span></span></span>
        </div>
        <label for="ac-q" style="font-weight: 700;">검색어</label>
        <div style="display: flex; align-items: center; gap: 8px;">
          <input id="ac-q" placeholder="S/N · 기체번호 · GCS 식별자 입력" style="width: 760px; max-width: 100%; height: 28px; box-sizing: border-box; padding: 0 10px; border: 1px solid #CCCCCC; font: 400 12px var(--font-primary);">
          <div style="flex-grow: 1;"></div>
          <button type="button" aria-label="초기화" style="width: 30px; height: 30px; border: 1px solid #CCCCCC; border-radius: 3px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"></path></svg></button>
          <button type="button" style="width: 80px; height: 30px; border: 0; border-radius: 3px; background: #CE2315; color: #FFFFFF; font: 700 12px var(--font-primary);">검색</button>
        </div>
      </form>

      <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;">

        <section aria-label="기체 선택" style="flex: 1 1 260px; max-width: 300px; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; align-items: center; font-size: 12px; padding-bottom: 2px;"><span>총 3대</span><div style="flex-grow: 1;"></div><button type="button" style="height: 26px; padding: 0 10px; border: 0; border-radius: 3px; background: #CE2315; color: #FFFFFF; font: 700 11px var(--font-primary);">기체 등록</button></div>
          <sc-for list="{{list}}" as="d" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" style="width: 100%; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border: {{d.border}}; background: {{d.bg}}; border-radius: 6px; color: #0E1C31; font-family: inherit; cursor: pointer;">
              <span style="display: flex; align-items: center; gap: 8px; width: 100%;"><span style="font-size: 14px; font-weight: 700; flex-grow: 1;">{{d.id}}</span><x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="{{d.badge}}">{{d.state}}</x-import></span>
              <span style="font-size: 12px; color: #475467;">{{d.model}} · {{d.owner}}</span>
            </button>
          </sc-for>
        </section>

        <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">

          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
            <h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.6px;">{{cur.id}}</h2>
            <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="{{cur.badge}}">{{cur.state}}</x-import>
            <span style="font-size: 13px; color: #667085;">aircraft_id (GCS 식별자) {{cur.gcs}}</span>
            <div style="flex-grow: 1;"></div>
            <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.Button" variant="secondary">정비 등록</x-import>
            <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.Button" variant="primary">수정</x-import>
          </div>

          <div role="tablist" aria-label="기체 정보" style="display: flex; gap: 4px; border-bottom: 1px solid #DFE7EB;">
            <a href="#ac-info" role="tab" aria-selected="true" style="padding: 10px 14px; font-size: 14px; font-weight: 600; color: #EF4122; border-bottom: 2px solid #EF4122; margin-bottom: -1px;">기본 정보</a>
            <a href="#ac-module" role="tab" aria-selected="false" style="padding: 10px 14px; font-size: 14px; color: #475467;">파종 모듈 · 펌웨어</a>
            <a href="#ac-battery" role="tab" aria-selected="false" style="padding: 10px 14px; font-size: 14px; color: #475467;">배터리</a>
            <a href="#ac-service" role="tab" aria-selected="false" style="padding: 10px 14px; font-size: 14px; color: #475467;">정비 · A/S 이력</a>
            <a href="#ac-pilot" role="tab" aria-selected="false" style="padding: 10px 14px; font-size: 14px; color: #475467;">조종사</a>
          </div>

          <section id="ac-info" aria-label="기본 정보" style="border: 1px solid #DFE7EB; border-radius: 6px; padding: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 24px; font-size: 14px;">
            <sc-for list="{{cur.info}}" as="f" hint-placeholder-count="9">
              <div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: #667085;">{{f.k}}</span><span>{{f.v}}</span></div>
            </sc-for>
          </section>

          <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch;">
            <section id="ac-module" aria-label="파종 모듈" style="flex: 1 1 320px; min-width: 0; border: 1px solid #DFE7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
              <h3 style="margin: 0; font-size: 15px; font-weight: 700;">파종 모듈 · 펌웨어</h3>
              <sc-for list="{{cur.module}}" as="f" hint-placeholder-count="4">
                <div style="display: flex; align-items: center; gap: 8px; font-size: 14px;"><span style="color: #667085; width: 96px; font-size: 13px;">{{f.k}}</span><span>{{f.v}}</span></div>
              </sc-for>
              <div style="display: flex; align-items: center; gap: 8px; font-size: 13px;"><span style="color: #667085; width: 96px;">펌웨어 상태</span><x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="{{cur.fwBadge}}">{{cur.fwState}}</x-import></div>
            </section>

            <section id="ac-battery" aria-label="배터리" style="flex: 2 1 420px; min-width: 0; border: 1px solid #DFE7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
              <div style="display: flex; align-items: center; gap: 8px;"><h3 style="margin: 0; font-size: 15px; font-weight: 700;">배터리</h3><span style="font-size: 13px; color: #667085;">{{cur.batCount}}개 매핑</span></div>
              <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
                <thead><tr style="background: #EEEEEE; color: #475467;"><th scope="col" style="text-align: left; padding: 8px; font-weight: 600;">S/N</th><th scope="col" style="text-align: right; padding: 8px; font-weight: 600;">사이클</th><th scope="col" style="text-align: right; padding: 8px; font-weight: 600;">최고 온도</th><th scope="col" style="text-align: left; padding: 8px; font-weight: 600;">상태</th></tr></thead>
                <tbody>
                  <sc-for list="{{cur.bats}}" as="b" hint-placeholder-count="4">
                    <tr style="border-bottom: 1px solid #EEEEEE;"><td style="padding: 8px;">{{b.sn}}</td><td style="padding: 8px; text-align: right;">{{b.cyc}}</td><td style="padding: 8px; text-align: right;">{{b.temp}}</td><td style="padding: 8px;"><x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="{{b.badge}}">{{b.state}}</x-import></td></tr>
                  </sc-for>
                </tbody>
              </table>
            </section>
          </div>

          <section id="ac-service" aria-label="정비 · A/S 이력" style="border: 1px solid #DFE7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 2px;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;"><h3 style="margin: 0; font-size: 15px; font-weight: 700;">정비 · A/S 이력</h3><div style="flex-grow: 1;"></div><a href="#" style="font-size: 12px;">전체 보기</a></div>
            <sc-for list="{{cur.service}}" as="v" hint-placeholder-count="3">
              <div style="display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid #EEEEEE; font-size: 14px;">
                <span style="width: 86px; color: #667085;">{{v.date}}</span>
                <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="{{v.badge}}">{{v.kind}}</x-import>
                <span style="flex-grow: 1;">{{v.desc}}</span>
                <span style="color: #475467;">{{v.cost}}</span>
              </div>
            </sc-for>
          </section>

          <section id="ac-pilot" aria-label="조종사" style="border: 1px solid #DFE7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
            <h3 style="margin: 0; font-size: 15px; font-weight: 700;">배정 조종사</h3>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; font-size: 14px;">
              <div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: #667085;">조종사</span><span>{{cur.pilot}}</span></div>
              <div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: #667085;">자격번호</span><span>[자격번호]</span></div>
              <div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: #667085;">유효기간</span><span>{{cur.pilotExp}}</span></div>
              <div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: #667085;">이 기체 비행시간</span><span>{{cur.pilotHours}}</span></div>
            </div>
          </section>

        </div>
      </div>
    </main>
  </div>
</div>
</script>
