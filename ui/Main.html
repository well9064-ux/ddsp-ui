<script type="text/x-dc-logic" id="dc-src">
var STEPS = ['처방맵 등록', '임무 생성', '전송 전 확인', 'GCS 서버 전송', '조종기 임무 확인', '파종'];
var CHECKS = ['필지와 소유 농가·법인이 맞습니다', '전송할 드론과 조종기가 맞습니다', '처방맵 버전과 예상 파종량을 확인했습니다'];
var INIT_CONFIRM = false;
class Component extends DCLogic {
  renderVals() {
    var self = this, s = this.state || {};
    var confirm = s.confirm === undefined ? INIT_CONFIRM : s.confirm;
    var sent = !!s.sent;
    var ck = s.ck || (INIT_CONFIRM ? [true, true, true] : [false, false, false]);
    var all = ck.every(function (x) { return x; });
    var cur = sent ? 3 : (confirm ? 2 : 1);
    return {
      yes: true,
      rounds: [
        { value: '1', label: '1회차 / 총 1회차 (단일)' },
        { value: '2', label: '2회차로 나눔' }
      ],
      drones: [{ value: 'dr01', label: 'DR-01 · 국산 파종드론' }],
      steps: STEPS.map(function (l, i) {
        var done = i < cur, now = i === cur;
        return { n: String(i + 1), label: l, sep: i > 0, cur: now ? 'step' : 'false', fg: done ? '#066B36' : (now ? '#0E1C31' : '#667085'), fw: now ? 600 : 400,
          bg: done ? '#E6F4EC' : (now ? '#EF4122' : '#EAEDF0'), nfg: now ? '#FFFFFF' : (done ? '#066B36' : '#667085') };
      }),
      msnStatus: sent ? 'wait' : (confirm ? 'progress' : 'wait'), msnLabel: sent ? '수행 대기' : (confirm ? '전송 전 확인' : '작성 중'),
      confirm: confirm,
      openConfirm: function () { self.setState({ confirm: true }); },
      closeConfirm: function () { self.setState({ confirm: false }); },
      checks: CHECKS.map(function (l, i) {
        var on = ck[i];
        return { label: l, on: on ? 'true' : 'false', bd: on ? '#EF4122' : '#98A2B3', bg: on ? '#EF4122' : '#FFFFFF', mark: on ? '✓' : '',
          pick: function () { var x = ck.slice(); x[i] = !on; self.setState({ ck: x }); } };
      }),
      sendBg: all ? '#EF4122' : '#F4A797', sendDisabled: all ? 'false' : 'true',
      send: function () { if (all) self.setState({ confirm: false, sent: true }); }
    };
  }
}
</script>
