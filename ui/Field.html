<script type="text/x-dc-logic" id="dc-src">
var FTABS = [
  { id: 'fz', label: '처방 결과' },
  { id: 'fr', label: '파종 결과' }
];
var STEPS = ['분석 신청', '분석 완료', '처방 확정', '파종 완료'];
var TABS = [
  { id: 'review', label: '처방 확인' },
  { id: 'plan', label: '작업 계획' },
  { id: 'live', label: '리플레이' },
  { id: 'hist', label: '이력' }
];
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var farm = s.role === 'farm';
    var tab = s.tab || (farm ? 'fz' : 'review');
    var layer = s.layer || (tab === 'live' || tab === 'hist' || tab === 'fr' ? 'route' : 'zones');
    return {
      isAdmin: !farm, isFarm: farm,
      roleAdminOn: farm ? 'false' : 'true', roleFarmOn: farm ? 'true' : 'false',
      roleAdminBg: farm ? 'transparent' : '#EF4122', roleFarmBg: farm ? '#EF4122' : 'transparent',
      pickAdmin: function () { self.setState({ role: 'admin', tab: null, layer: null }); },
      pickFarm: function () { self.setState({ role: 'farm', tab: null, layer: null }); },
      tabCols: farm ? 2 : 4,
      steps: STEPS.map(function (l, i) { var last = i === STEPS.length - 1; return { label: l, bar: '#5FD18F', fg: last ? '#FFFFFF' : '#A2A2A2', fw: last ? 700 : 500 }; }),
      farmCount: farm ? '내 농장 : 총 2개 ⌄' : '농장 : 총 586개 ⌄',
      s1Badge: farm ? '파종 완료' : '처방 v3', s10Badge: farm ? '분석 중' : '처방 대기',
      infoK1: farm ? '파종일' : '파종 예정일', infoK2: farm ? '상태' : '처방 버전', infoV2: farm ? '파종 완료' : 'v3',
      routeLabel: farm ? '파종 결과' : '작업 경로',
      cardL1: farm ? '진행 상태   파종 완료' : '처방 버전   v3 · 등록 완료',
      cardL2: farm ? '파종일       2027.04.12' : '파종 예정일  2027.04.12 09:00',
      cardBtn: farm ? '파종 결과 보기 ›' : '실시간 리플레이 열기 ›',
      cardGo: function () { if (farm) self.setState({ tab: 'fr', layer: 'route', card: false }); else window.location.href = 'Monitor.html'; },
      tFz: tab === 'fz', tFr: tab === 'fr',
      tabs: (farm ? FTABS : TABS).map(function (t) {
        var on = t.id === tab;
        return {
          label: t.label, on: on ? 'true' : 'false',
          bg: on ? '#EF4122' : 'transparent', fg: on ? '#FFFFFF' : '#97A0AF',
          pick: function () { self.setState({ tab: t.id, layer: null }); }
        };
      }),
      tReview: tab === 'review', tPlan: tab === 'plan', tLive: tab === 'live', tHist: tab === 'hist',
      showZones: layer === 'zones', showRoute: layer === 'route',
      showDem: layer === 'dem', showZoneLabels: layer !== 'dem', showRxSum: !farm && layer !== 'dem', showRxLegend: layer !== 'dem',
      layerDem: layer === 'dem' ? 'true' : 'false',
      demBorder: layer === 'dem' ? '#EF4122' : '#575757', demText: layer === 'dem' ? '#EF4122' : '#FFFFFF',
      pickDem: function () { self.setState({ layer: 'dem', card: false }); },
      layerZones: layer === 'zones' ? 'true' : 'false', layerRoute: layer === 'route' ? 'true' : 'false',
      zoneBorder: layer === 'zones' ? '#EF4122' : '#575757', zoneText: layer === 'zones' ? '#EF4122' : '#FFFFFF',
      routeBorder: layer === 'route' ? '#EF4122' : '#575757', routeText: layer === 'route' ? '#EF4122' : '#FFFFFF',
      cardOpen: !!s.card,
      openCard: function () { self.setState({ card: true }); },
      closeCard: function () { self.setState({ card: false }); },
      pickZones: function () { self.setState({ layer: 'zones' }); },
      pickRoute: function () { self.setState({ layer: 'route' }); }
    };
  }
}
</script>
