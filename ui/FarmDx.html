      farms: ['s1', 's10', 's12'].map(function (k) {
        var x = FARMS[k], on = k === fid;
        return { name: x.name, sub: x.sub, st: x.st, stBg: x.stBg, stFg: x.stFg, on: on ? 'true' : 'false', bg: on ? 'rgba(77,77,77,0.8)' : 'transparent',
          pick: function () { self.setState({ f: k }); } };
      }),
      cur: { name: f.name, reqNo: f.reqNo, msg: f.msg },
      steps: STEPS.map(function (l, i) {
        var done = i < f.step, now = i === f.step - 1;
        return { label: l, bar: done ? '#5FD18F' : '#3A3A3A', fg: now ? '#FFFFFF' : (done ? '#A2A2A2' : '#6A6A6A'), fw: now ? 700 : 500 };
      }),
      hasLayers: f.layers && !seed, canApply: !!f.apply, hasSeeding: f.seeding,
      layers: LAYERS.map(function (l) {
        var on = l.id === lay;
        return { label: l.label, on: on ? 'true' : 'false', bg: on ? '#EF4122' : 'transparent', fg: on ? '#FFFFFF' : '#97A0AF', pick: function () { self.setState({ layer: l.id }); } };
      }),
      showNdvi: f.layers && grow, showSm: f.layers && tab === 'soil' && lay === 'sm', showDem: f.layers && tab === 'soil' && lay === 'dem',
      s10Fill: fid === 's10' && !seed ? 'rgba(255,200,119,0.18)' : 'none',
      legendTitle: LEG[0], legendGrad: LEG[1], legendLo: LEG[2], legendHi: LEG[3], resText: LEG[4]
    };
  }
}
</script>
</body>
</html>
