; display: inline-flex; align-items: center; background: #FFFFFF; border: 2px solid #222222; font-weight: 700; font-size: 12px; position: relative; z-index: 2;">정기 점검</span><span style="height: 32px; padding: 0 14px; margin-left: -1px; display: inline-flex; align-items: center; background: #FFFFFF; border: 1px solid #CCCCCC; font-size: 12px; position: relative; z-index: 1;">수리</span><span style="height: 32px; padding: 0 14px; margin-left: -1px; display: inline-flex; align-items: center; background: #FFFFFF; border: 1px solid #CCCCCC; font-size: 12px; position: relative; z-index: 1;">부품 교체</span><span style="height: 32px; padding: 0 14px; margin-left: -1px; display: inline-flex; align-items: center; background: #FFFFFF; border: 1px solid #CCCCCC; font-size: 12px; position: relative; z-index: 1;">펌웨어</span><span style="height: 32px; padding: 0 14px; margin-left: -1px; display: inline-flex; align-items: center; background: #FFFFFF; border: 1px solid #CCCCCC; font-size: 12px; position: relative; z-index: 1;">기타</span></div></td></tr><tr><th scope="row" style="width: 150px; padding: 11px 14px; background: #F2F4F7; border-bottom: 1px solid #E4E7EC; font-size: 13px; font-weight: 700; color: #344054; text-align: left; vertical-align: middle; white-space: nowrap;">정비 내용 <span style="color: #CE2315;">*</span></th><td style="padding: 8px 14px; border-bottom: 1px solid #E4E7EC; font-size: 13px; vertical-align: middle;"><span style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid #CCCCCC; border-radius: 3px; font: 400 13px var(--font-primary); color: #222222; background: #FFFFFF; display: inline-flex; align-items: center; width: 100%; height: 72px; align-items: flex-start; padding-top: 8px; color: #98A2B3;">점검·수리 내용을 입력하세요</span></td></tr><tr><th scope="row" style="width: 150px; padding: 11px 14px; background: #F2F4F7; border-bottom: 1px solid #E4E7EC; font-size: 13px; font-weight: 700; color: #344054; text-align: left; vertical-align: middle; white-space: nowrap;">교체 부품</th><td style="padding: 8px 14px; border-bottom: 1px solid #E4E7EC; font-size: 13px; vertical-align: middle;"><table style="border-collapse: collapse; font-size: 13px;"><thead><tr style="color: #667085;"><th style="text-align: left; padding: 0 8px 6px 0; font-weight: 600;">부품명</th><th style="text-align: left; padding: 0 8px 6px 0; font-weight: 600;">수량</th><th></th></tr></thead><tbody>
          <tr><td style="padding: 0 8px 6px 0;"><span style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid #CCCCCC; border-radius: 3px; font: 400 13px var(--font-primary); color: #222222; background: #FFFFFF; display: inline-flex; align-items: center; width: 240px; color: #98A2B3;">부품명</span></td><td style="padding: 0 8px 6px 0;"><span style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid #CCCCCC; border-radius: 3px; font: 400 13px var(--font-primary); color: #222222; background: #FFFFFF; display: inline-flex; align-items: center; width: 80px; color: #98A2B3;">0</span></td><td style="padding: 0 0 6px 0; font-size: 12px; color: #CE2315;"></td></tr>
          
        </tbody></table><span style="font-size: 12px; font-weight: 700; color: #0070C0;">+ 부품 추가</span></td></tr></tbody></table>
      </section>
      <section style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="margin: 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px;">처리 정보</h2>
        <table style="width: 100%; border-collapse: collapse; border-top: 2px solid #344054;"><tbody><tr><th scope="row" style="width: 150px; padding: 11px 14px; background: #F2F4F7; border-bottom: 1px solid #E4E7EC; font-size: 13px; font-weight: 700; color: #344054; text-align: left; vertical-align: middle; white-space: nowrap;">수행자</th><td style="padding: 8px 14px; border-bottom: 1px solid #E4E7EC; font-size: 13px; vertical-align: middle;"><span style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid #CCCCCC; border-radius: 3px; font: 400 13px var(--font-primary); color: #222222; background: #FFFFFF; display: inline-flex; align-items: center; width: 300px; color: #98A2B3;">이름 · 소속</span></td></tr><tr><th scope="row" style="width: 150px; padding: 11px 14px; background: #F2F4F7; border-bottom: 1px solid #E4E7EC; font-size: 13px; font-weight: 700; color: #344054; text-align: left; vertical-align: middle; white-space: nowrap;">비용</th><td style="padding: 8px 14px; border-bottom: 1px solid #E4E7EC; font-size: 13px; vertical-align: middle;"><span style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid #CCCCCC; border-radius: 3px; font: 400 13px var(--font-primary); color: #222222; background: #FFFFFF; display: inline-flex; align-items: center; width: 160px; color: #98A2B3;">0</span> <span style="font-size: 12px; color: #888888;">원 (선택)</span></td></tr><tr><th scope="row" style="width: 150px; padding: 11px 14px; background: #F2F4F7; border-bottom: 1px solid #E4E7EC; font-size: 13px; font-weight: 700; color: #344054; text-align: left; vertical-align: middle; white-space: nowrap;">다음 점검 예정일</th><td style="padding: 8px 14px; border-bottom: 1px solid #E4E7EC; font-size: 13px; vertical-align: middle;"><span style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid #CCCCCC; border-radius: 3px; font: 400 13px var(--font-primary); color: #222222; background: #FFFFFF; display: inline-flex; align-items: center; width: 180px; color: #98A2B3;">YYYY-MM-DD (선택)</span></td></tr><tr><th scope="row" style="width: 150px; padding: 11px 14px; background: #F2F4F7; border-bottom: 1px solid #E4E7EC; font-size: 13px; font-weight: 700; color: #344054; text-align: left; vertical-align: middle; white-space: nowrap;">첨부</th><td style="padding: 8px 14px; border-bottom: 1px solid #E4E7EC; font-size: 13px; vertical-align: middle;"><div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;"><button type="button" style="height: 36px; min-width: 88px; padding: 0 16px; box-sizing: border-box; border-radius: 3px; background: #FFFFFF; color: #333333; border: 1px solid #BBBBBB; font: 700 13px var(--font-primary); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; height: 32px;">파일 선택</button><span style="font-size: 12px; color: #888888;">사진 · 문서 최대 5개 · jpg, png, pdf</span></div></td></tr></tbody></table>
      </section>
      <div style="display: flex; align-items: center; gap: 8px; padding-top: 6px;">
        
        <div style="flex-grow: 1;"></div>
        <a href="Aircraft.html" style="height: 36px; min-width: 88px; padding: 0 16px; box-sizing: border-box; border-radius: 3px; background: #FFFFFF; color: #333333; border: 1px solid #BBBBBB; font: 700 13px var(--font-primary); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">목록</a>
        <a href="Aircraft.html" style="height: 36px; min-width: 88px; padding: 0 16px; box-sizing: border-box; border-radius: 3px; background: #FFFFFF; color: #333333; border: 1px solid #BBBBBB; font: 700 13px var(--font-primary); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">취소</a>
        <button type="button" onClick="{{save}}" style="height: 36px; min-width: 88px; padding: 0 16px; box-sizing: border-box; border-radius: 3px; background: #CE2315; color: #FFFFFF; border: 1px solid #CE2315; font: 700 13px var(--font-primary); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">등록</button>
      </div>
      <sc-if value="{saved}" hint-placeholder-val="{false}"><div role="status" style="padding: 10px 14px; background: #E6F4EC; border-radius: 4px; color: #066B36; font-size: 13px; font-weight: 600;">정비 이력을 등록했습니다. 기체 관리 › 정비 이력에 추가됩니다.</div></sc-if>
    </main>
  </div>
</div>
</script>
<script type="text/x-dc-logic" id="dc-src">
class Component extends DCLogic {
  renderVals() {
    var self = this, s = this.state || {};
    return {
      save: function () { self.setState({ saved: true }); }, saved: !!s.saved,
      confirmDelete: !!s.del,
      openDelete: function () { self.setState({ del: true }); },
      closeDelete: function () { self.setState({ del: false }); }
    };
  }
}

;(function () {
  var PAGE = 'MaintForm', ACT_BG = '#FFFFFF';
  var BASE = [['DroneDx', '정밀진단 관리'], ['Field', '드론 파종'], ['Main', '처방 확인 · 임무 생성'], ['Missions', '임무 관리'], ['Fleet', '드론 현황'], ['Monitor', '실시간 리플레이 · DR-01'], ['HistoryList', '작업 이력']];
  var EXTRA = { Aircraft: '기체 관리', History: '작업 이력 상세', DroneDxData: '결과 등록 · 이력', DroneDxReg: '결과 등록', AircraftForm: '기체 등록', AircraftEdit: '기체 수정 · DR-02', MaintForm: '정비 등록', MaintEdit: '정비 이력 수정' };
  var KEY = PAGE === 'MainSend' ? 'Main' : PAGE;
  var LS = 'ddsp-closed-tabs';
  function load() { try { return JSON.parse(window.localStorage.getItem(LS) || '[]'); } catch (e) { return []; } }
  function save(x) { try { window.localStorage.setItem(LS, JSON.stringify(x)); } catch (e) {} }
  function go(href) { try { window.location.href = href; } catch (e) {} }
  var orig = Component.prototype.renderVals;
  Component.prototype.renderVals = function () {
    var v = orig.call(this) || {}, self = this;
    var st = this.state || {};
    var closed = (st._tabsClosed || load()).filter(function (k) { return k !== KEY; });
    var all = BASE.slice(); if (EXTRA[KEY]) all.push([KEY, EXTRA[KEY]]);
    var vis = all.filter(function (t) { return closed.indexOf(t[0]) < 0; });
    function closeTab(k) {
      var c = closed.concat([k]); save(c);
      if (k === KEY) {
        var i = vis.map(function (t) { return t[0]; }).indexOf(k);
        var nb = vis[i - 1] || vis[i + 1];
        go(nb ? nb[0] + '.html' : 'Fleet.html');
      } else { self.setState({ _tabsClosed: c }); }
    }
    v.openTabs = vis.map(function (t) {
      var on = t[0] === KEY;
      return { label: t[1], href: on ? '#' : t[0] + '.html', sel: on ? 'true' : 'false', bg: on ? ACT_BG : '#E2E2E2', bt: on ? '2px solid #EF4122' : '2px solid transparent',
        fg: on ? '#222222' : '#555555', fw: on ? 700 : 600, xc: on ? '#666666' : '#999999', closeLabel: t[1] + ' 탭 닫기', close: function () { closeTab(t[0]); } };
    });
    v.closeAllTabs = function () { var c = all.map(function (t) { return t[0]; }).filter(function (k) { return k !== KEY; }); save(c); self.setState({ _tabsClosed: c }); };
    return v;
  };
})();
</script>
</body>
