<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>드론 현황 · 드론 파종 컨셉 UI</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">

<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<helmet>
<style>
body{margin:0}
a{color:#0070C0;text-decoration:none}a:hover{color:#025996}
</style>
</helmet>
<div style="min-height: 1000px; display: flex; background: #FFFFFF; font-family: var(--font-primary); color: #222222; font-variant-numeric: tabular-nums;">

  <div style="flex: 0 0 230px; display: flex;">
    <dc-import name="Nav" active="fleet" hint-size="230px,1000px"></dc-import>
  </div>

  <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;">
    <header style="height: 50px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: #231F20; color: #FFFFFF;">
      <span style="font-size: 13px; font-weight: 600;">2027년 4월 12일</span>
      <div style="flex-grow: 1;"></div>
      <span style="font-size: 13px; font-weight: 600;">안녕하세요, 관리자 님</span>
    </header>
    <div role="tablist" aria-label="열린 화면" style="height: 34px; flex-shrink: 0; display: flex; align-items: flex-end; gap: 2px; padding: 0 10px; background: #EEEEEE;">
      <a href="#" role="tab" aria-selected="true" style="height: 30px; padding: 0 22px; display: flex; align-items: center; background: #FFFFFF; color: #222222; font-size: 12px; font-weight: 600;">드론 현황</a>
    </div>

    <main style="flex: 1 1 auto; box-sizing: border-box; padding: 18px 16px 32px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #DDDDDD;">
        <h1 style="margin: 0; font-size: 18px; font-weight: 800;">드론 현황</h1>
        <span style="margin-left: 10px; font-size: 12px; color: #888888;">기준 2027.04.12 09:15</span>
        <div style="flex-grow: 1;"></div>
        <span style="font-size: 12px; color: #888888;">드론 관리 › <b style="color: #333333;">드론 현황</b></span>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch;">
        <div style="flex: 1 1 480px; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.KpiCard" label="보유 기체" value="3" unit="대"></x-import>
          <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.KpiCard" label="작업중" value="2" unit="대" accent="#0070C0"></x-import>
          <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.KpiCard" label="가용 · 대기" value="0" unit="대" accent="#107C41"></x-import>
          <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.KpiCard" label="정비 중" value="1" unit="대" accent="#E76F00"></x-import>
          <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.KpiCard" label="누적 작업면적" value="18,150" unit="평"></x-import>
          <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.KpiCard" label="누적 비행시간" value="6.2" unit="시간"></x-import>
        </div>
        <section aria-label="이번 주 가동" style="flex: 1.2 1 560px; min-width: 0; box-sizing: border-box; border: 1px solid #DFE7EB; border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; align-items: baseline; gap: 8px;"><h2 style="margin: 0; font-size: 15px; font-weight: 700;">이번 주 가동</h2><span style="font-size: 12px; color: #777777;">일별 비행시간 합계 · 전체 기체</span><div style="flex-grow: 1;"></div><span style="font-size: 12px; font-weight: 600;">합계 4.1시간</span></div>
          <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; min-height: 110px;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><span style="font-size: 11px; color: #475467;">0.9h</span><div style="width: 100%; height: 48px; background: #0070C0; border-radius: 3px;"></div><span style="font-size: 12px; color: #777777;">월</span></div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><span style="font-size: 11px; color: #475467;">0.5h</span><div style="width: 100%; height: 26px; background: #0070C0; border-radius: 3px;"></div><span style="font-size: 12px; color: #777777;">화</span></div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><span style="font-size: 11px; color: #475467;">1.4h</span><div style="width: 100%; height: 76px; background: #0070C0; border-radius: 3px;"></div><span style="font-size: 12px; color: #777777;">수</span></div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><span style="font-size: 11px; color: #475467;">-</span><div style="width: 100%; height: 4px; background: #D0D5DD; border-radius: 3px;"></div><span style="font-size: 12px; color: #777777;">목</span></div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><span style="font-size: 11px; color: #475467;">1.3h</span><div style="width: 100%; height: 62px; background: #0070C0; border-radius: 3px;"></div><span style="font-size: 12px; color: #777777;">금</span></div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><span style="font-size: 11px; color: #475467;">-</span><div style="width: 100%; height: 4px; background: #D0D5DD; border-radius: 3px;"></div><span style="font-size: 12px; color: #777777;">토</span></div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><span style="font-size: 11px; color: #475467;">-</span><div style="width: 100%; height: 4px; background: #D0D5DD; border-radius: 3px;"></div><span style="font-size: 12px; color: #777777;">일</span></div>
          </div>
        </section>
      </div>

      <section aria-label="지금 운항 중인 기체" style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px;">

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
          <a href="Monitor.html" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: #FFFFFF; border: 1px solid #EC4023; border-radius: 6px; color: #0E1C31;">
            <div style="display: flex; align-items: center; gap: 8px;"><span style="font-size: 15px; font-weight: 700;">DR-01</span><x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="progress">작업중</x-import><div style="flex-grow: 1;"></div><span style="font-size: 12px; font-weight: 600; color: #EC4023;">실시간 관제 ›</span></div>
            <div style="font-size: 13px; color: #475467;">MSN-0412-01 · 김제 GJ-S1 · 조종사 박OO</div>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #475467;"><div style="flex-grow: 1; height: 6px; background: #EAEDF0; border-radius: 999px;"><div style="width: 62%; height: 6px; background: #0070C0; border-radius: 999px;"></div></div><span style="font-weight: 600; color: #0E1C31;">62%</span><span>배터리 64%</span></div>

          <a href="Monitor.html" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: #FFFFFF; border: 1px solid #DFE7EB; border-radius: 6px; color: #0E1C31;">
            <div style="display: flex; align-items: center; gap: 8px;"><span style="font-size: 15px; font-weight: 700;">DR-03</span><x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="error">통신 지연</x-import><div style="flex-grow: 1;"></div><span style="font-size: 12px; font-weight: 600; color: #EC4023;">실시간 관제 ›</span></div>
            <div style="font-size: 13px; color: #475467;">MSN-0412-01 · 김제 GJ-S1 · 조종사 최OO</div>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #475467;"><div style="flex-grow: 1; height: 6px; background: #EAEDF0; border-radius: 999px;"><div style="width: 55%; height: 6px; background: #E76F00; border-radius: 999px;"></div></div><span style="font-weight: 600; color: #0E1C31;">55%</span><span>마지막 수신 12초 전</span></div>
          </a>
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: #F9FAFB; border: 1px solid #DFE7EB; border-radius: 6px;">
            <div style="display: flex; align-items: center; gap: 8px;"><span style="font-size: 15px; font-weight: 700;">DR-02</span><x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="wait">정비 중</x-import></div>
            <div style="font-size: 13px; color: #475467;">배터리 교체 · 다음 임무 MSN-0414-01 (04.14 08:30)</div>
            <div style="font-size: 12px; color: #667085;">운항하지 않는 기체는 다음 배정 임무를 보여줍니다</div>
          </div>
        </div>
      </section>

      <form role="search" aria-label="기체 검색" style="padding: 14px 16px; background: #F5F5F5; border: 1px solid #E2E2E2; display: grid; grid-template-columns: 90px 1fr; gap: 9px 10px; align-items: center; font-size: 12px;">
        <span style="font-weight: 700;">소유 구분</span>
        <div role="group" aria-label="소유 구분" style="display: flex;">
          <sc-for list="{{owners}}" as="o" hint-placeholder-count="4">
            <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="height: 28px; padding: 0 14px; margin-left: -1px; background: #FFFFFF; border: {{o.border}}; color: #222222; font: {{o.font}} 12px var(--font-primary); cursor: pointer; position: relative; z-index: {{o.z}};">{{o.label}}</button>
          </sc-for>
        </div>
        <span style="font-weight: 700;">상태</span>
        <div role="group" aria-label="상태" style="display: flex;">
          <sc-for list="{{states}}" as="o" hint-placeholder-count="4">
            <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="height: 28px; padding: 0 14px; margin-left: -1px; background: #FFFFFF; border: {{o.border}}; color: #222222; font: {{o.font}} 12px var(--font-primary); cursor: pointer; position: relative; z-index: {{o.z}};">{{o.label}}</button>
          </sc-for>
        </div>
        <span style="font-weight: 700;">기종</span>
        <div style="display: flex; align-items: center; gap: 40px;">
          <span style="width: 360px; height: 28px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: #FFFFFF; border: 1px solid #CCCCCC;">전체 <span aria-hidden="true">⌄</span></span>
          <span style="display: flex; align-items: center; gap: 40px;"><span style="font-weight: 700;">관리 대리점</span><span style="width: 300px; height: 28px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: #FFFFFF; border: 1px solid #CCCCCC;">전체 <span aria-hidden="true">⌄</span></span></span>
        </div>
        <label for="fl-q" style="font-weight: 700;">검색어</label>
        <div style="display: flex; align-items: center; gap: 8px;">
          <input id="fl-q" placeholder="S/N · 기체번호 · GCS 식별자 입력" style="width: 760px; max-width: 100%; height: 28px; box-sizing: border-box; padding: 0 10px; border: 1px solid #CCCCCC; font: 400 12px var(--font-primary);">
          <div style="flex-grow: 1;"></div>
          <button type="button" aria-label="초기화" onClick="{{reset}}" style="width: 30px; height: 30px; border: 1px solid #CCCCCC; border-radius: 3px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"></path></svg></button>
          <button type="button" style="width: 80px; height: 30px; border: 0; border-radius: 3px; background: #CE2315; color: #FFFFFF; font: 700 12px var(--font-primary);">검색</button>
        </div>
      </form>

      <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;">
        <section aria-label="기체 목록" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; align-items: center; font-size: 12px;">
            <span>조회결과 총 {{count}}건</span>
          </div>
          <div style="overflow-x: auto;">
            <table style="width: 100%; min-width: 820px; border-collapse: collapse; font-size: 13px;">
              <thead><tr style="background: #4D4D4D; color: #FFFFFF;">
                <th scope="col" style="padding: 10px 8px; font-weight: 600; text-align: left;">기체</th>
                <th scope="col" style="padding: 10px 8px; font-weight: 600; text-align: left;">기종</th>
                <th scope="col" style="padding: 10px 8px; font-weight: 600; text-align: left;">소유</th>
                <th scope="col" style="padding: 10px 8px; font-weight: 600;">상태</th>
                <th scope="col" style="padding: 10px 8px; font-weight: 600; text-align: left;">파종 모듈 · FW</th>
                <th scope="col" style="padding: 10px 8px; font-weight: 600; text-align: right;">배터리</th>
                <th scope="col" style="padding: 10px 8px; font-weight: 600; text-align: right;">누적 면적(평)</th>
                <th scope="col" style="padding: 10px 8px; font-weight: 600; text-align: left;">최근 작업</th>
              </tr></thead>
              <tbody>
                <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
                  <tr style="background: {{r.bg}}; border-bottom: 1px solid #E5E5E5;">
                    <td style="padding: 10px 8px;"><a href="Aircraft.html" style="font-weight: 600;">{{r.id}}</a><div style="font-size: 12px; color: #777777;">S/N {{r.sn}}</div></td>
                    <td style="padding: 10px 8px;">{{r.model}}</td>
                    <td style="padding: 10px 8px;">{{r.owner}}</td>
                    <td style="padding: 10px 8px; text-align: center;"><x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="{{r.badge}}">{{r.state}}</x-import></td>
                    <td style="padding: 10px 8px;">{{r.fw}}<sc-if value="{{r.fwWarn}}" hint-placeholder-val="{{false}}"> <span style="color: #C25E00;">업데이트 필요</span></sc-if></td>
                    <td style="padding: 10px 8px; text-align: right;">{{r.bat}}</td>
                    <td style="padding: 10px 8px; text-align: right;">{{r.area}}</td>
                    <td style="padding: 10px 8px;">{{r.last}}</td>
                  </tr>
                </sc-for>
              </tbody>
            </table>
          </div>
          <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
            <div style="padding: 24px; text-align: center; font-size: 13px; color: #888888; border-bottom: 1px solid #E5E5E5;">조건에 맞는 기체가 없습니다.</div>
          </sc-if>
        </section>

        <aside aria-label="점검 알림" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
          <div style="border: 1px solid #DFE7EB; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 8px;">
            <h2 style="margin: 0; font-size: 15px; font-weight: 700;">확인 필요</h2>
            <div style="display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #EEEEEE;">
              <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="wait">펌웨어</x-import>
              <div style="font-size: 13px; line-height: 18px;"><div>DR-02 파종 모듈 v1.4.2 배포 대상</div><div style="font-size: 12px; color: #777777;">현재 v1.4.0 · 정비 완료 후 적용</div></div>
            </div>
            <div style="display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #EEEEEE;">
              <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="error">배터리</x-import>
              <div style="font-size: 13px; line-height: 18px;"><div>BT-0104 충방전 사이클 280 / 300회</div><div style="font-size: 12px; color: #777777;">DR-01 · 교체 권장 임박</div></div>
            </div>
            <div style="display: flex; gap: 10px; align-items: flex-start; padding: 8px 0;">
              <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="neutral">정기 점검</x-import>
              <div style="font-size: 13px; line-height: 18px;"><div>DR-03 50시간 점검 예정</div><div style="font-size: 12px; color: #777777;">04.20 · DJI 공식 대리점</div></div>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>
</div>
</script>
<script type="text/x-dc-logic" id="dc-src">
var OWNERS = [{ id: 'all', label: '전체' }, { id: 'corp', label: '법인' }, { id: 'farmer', label: '농민' }, { id: 'research', label: '실증 운영자' }];
var STATES = [{ id: 'all', label: '전체' }, { id: 'work', label: '작업중' }, { id: 'ready', label: '가용 · 대기' }, { id: 'repair', label: '정비 중' }];
var DRONES = [
  { id: 'DR-01', sn: 'DSD-24-0001', model: '국산 파종드론 [모델명]', owner: '대동 실증 법인', ownerT: 'corp', st: 'work', state: '작업중', badge: 'progress', fw: 'SM-0107 · v1.4.2', bat: '4개', area: '8,470', last: '04.12 김제 GJ-S1' },
  { id: 'DR-02', sn: 'DSD-24-0002', model: '국산 파종드론 [모델명]', owner: '락로보틱스(실증)', ownerT: 'research', st: 'repair', state: '정비 중', badge: 'wait', fw: 'SM-0108 · v1.4.0', fwWarn: true, bat: '4개', area: '6,050', last: '04.09 김제 GJ-S14' },
  { id: 'DR-03', sn: 'AGR-T50-1183', model: 'DJI Agras T50', owner: '대동 실증 법인', ownerT: 'corp', st: 'work', state: '작업중', badge: 'progress', fw: '파종 키트 · v05.01', bat: '3개', area: '3,630', last: '04.12 김제 GJ-S1' }
];
function seg(list, cur, onPick) {
  return list.map(function (x) {
    var on = x.id === cur;
    return { label: x.label, pressed: on ? 'true' : 'false', border: on ? '2px solid #222222' : '1px solid #CCCCCC', font: on ? '700' : '400', z: on ? 2 : 1, pick: function () { onPick(x.id); } };
  });
}
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var ow = s.owner || 'all', st = s.st || 'all';
    var list = DRONES.filter(function (d) { return (ow === 'all' || d.ownerT === ow) && (st === 'all' || d.st === st); });
    return {
      owners: seg(OWNERS, ow, function (id) { self.setState({ owner: id }); }),
      states: seg(STATES, st, function (id) { self.setState({ st: id }); }),
      reset: function () { self.setState({ owner: 'all', st: 'all' }); },
      count: String(list.length),
      empty: list.length === 0,
      rows: list.map(function (d, i) { var r = Object.assign({}, d); r.fwWarn = !!d.fwWarn; r.bg = i % 2 ? '#FAFAFA' : '#FFFFFF'; return r; })
    };
  }
}
</script>
</body>
</html>
