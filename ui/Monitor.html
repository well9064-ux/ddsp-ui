              <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">재생 위치</span>
              <input type="range" min="0" max="1000" step="1" value="{{tInt}}" onChange="{{scrub}}" style="width: 100%; accent-color: #5AB0F0; cursor: pointer;">
            </label>
            <span style="min-width: 128px; text-align: right;">{{clockText}}</span>
            <button type="button" onClick="{{toggleSpeed}}" style="height: 28px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; background: transparent; color: #FFFFFF; font: 600 12px var(--font-primary); cursor: pointer;">{{speedLabel}}</button>
            <button type="button" onClick="{{goLive}}" style="height: 28px; padding: 0 10px; border: 0; border-radius: 999px; background: {{liveBg}}; color: #FFFFFF; font: 600 12px var(--font-primary); cursor: pointer;">실시간</button>
          </div>
          <div style="position: absolute; right: 12px; bottom: 8px; font-size: 10px; font-weight: 600; color: #FFFFFF;">NAVER · 국토지리정보원</div>
        </section>

        <aside aria-label="기체와 알림" style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">

          <div style="background: #FFFFFF; border: 1px solid #DFE7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
            <h2 style="margin: 0; font-size: 16px; font-weight: 600;">기체 · 운용</h2>
            <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #EF4122; border-radius: 6px; background: #FDECEA;">
              <span style="font-weight: 600; width: 52px; white-space: nowrap;">DR-01</span>
              <span style="flex-grow: 1; font-size: 12px; color: #475467;">{{d1Sub}}</span>
              <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="{{d1Badge}}">{{d1Label}}</x-import>
            </div>
            <div style="font-size: 12px; color: #667085; line-height: 18px;">1필지 1드론 · 운용자가 조종기로 직접 비행하고, 플랫폼은 GCS 서버에서 받은 로그를 파싱해 보여줍니다. 원격 제어는 하지 않습니다.</div>
          </div>

          <div style="background: #FFFFFF; border: 1px solid #DFE7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <h2 style="margin: 0; font-size: 16px; font-weight: 600;">DR-01 드론 로그</h2>
              <div style="flex-grow: 1;"></div>
              <span style="font-size: 12px; color: #667085;">10건 묶음 · 3~5초 지연 · RTK Fix</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
              <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px; background: #F9FAFB; border-radius: 6px;"><span style="font-size: 12px; color: #667085;">살포 상태</span><span style="font-size: 20px; font-weight: 600; color: {{sprayColor}};">{{spray}}</span></div>
              <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px; background: #F9FAFB; border-radius: 6px;"><span style="font-size: 12px; color: #667085;">잔량계</span><span style="font-size: 20px; font-weight: 600;">{{remainKg}}<span style="font-size: 12px; font-weight: 400; color: #475467;"> kg</span></span></div>
              <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px; background: #F9FAFB; border-radius: 6px;"><span style="font-size: 12px; color: #667085;">속도</span><span style="font-size: 20px; font-weight: 600;">{{spd}}<span style="font-size: 12px; font-weight: 400; color: #475467;"> m/s</span></span><span style="font-size: 12px; color: #667085;">계획 5.0</span></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: #F9FAFB; border-radius: 6px;">
              <div style="display: flex; align-items: center; font-size: 12px; color: #475467;"><span style="flex-grow: 1;">추정 분사량 (관리자 전용) · 현재 격자 중</span><span style="font-weight: 600; color: #0E1C31;">{{rate}} / 3.5 kg/10a</span></div>
              <div style="position: relative; height: 8px; background: #EAEDF0; border-radius: 999px;"><div style="width: {{rateW}}%; height: 8px; background: #107C41; border-radius: 999px;"></div><div style="position: absolute; left: 70%; top: -3px; width: 2px; height: 14px; background: #0E1C31;"></div></div>
              <div style="font-size: 12px; color: #667085;">처방 대비 {{rateDev}} · 개폐장치 분사량으로 연산한 추정치(농가·법인 비노출)</div>
            </div>

          <div style="background: #FFFFFF; border: 1px solid #DFE7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <h2 style="margin: 0; font-size: 16px; font-weight: 600;">알림</h2>
              <div style="flex-grow: 1;"></div>
              <a href="#" style="font-size: 12px;">전체 보기</a>
            </div>
            <sc-if value="{{showLost}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #EEEEEE;">
                <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="error">통신두절</x-import>
                <div style="flex-grow: 1; font-size: 14px; line-height: 18px;"><div>DR-01 드론 로그 미수신</div><div style="font-size: 12px; color: #667085;">{{lostSub}}</div></div>
                <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.Button" variant="primary" size="s">확인</x-import>
              </div>
            </sc-if>
            <sc-if value="{{showDeviation}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #EEEEEE;">
                <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="wait">경로 이탈</x-import>
                <div style="flex-grow: 1; font-size: 14px; line-height: 18px;"><div>DR-01 계획 경로에서 1.8m 이탈</div><div style="font-size: 12px; color: #667085;">{{devTime}} · 자동 복귀</div></div>
                <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.Button" variant="tertiary" size="s">확인</x-import>
              </div>
            </sc-if>
            <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 0;">
              <x-import component-from-global-scope="DaedongAgTechDesignSystem_822661.StatusBadge" status="neutral">작업 시작</x-import>
              <div style="flex-grow: 1; font-size: 14px; line-height: 18px;"><div>DR-01 이륙 · 1회차 시작</div><div style="font-size: 12px; color: #667085;">09:00:12 · GCS 서버 이벤트</div></div>
            </div>
          </div>

        </aside>
      </div>
    </main>

</script>
<script type="text/x-dc-logic" id="dc-src">
function fieldPt(u, v) { return [308 + 322 * u - 41 * v, 245 + 112 * u + 115 * v]; }
function buildRoute(vs) {
  var pts = [];
  vs.forEach(function (v, i) {
    var a = fieldPt(i % 2 ? 0.97 : 0.03, v), b = fieldPt(i % 2 ? 0.03 : 0.97, v);
    pts.push(a, b);
  });
  return pts;
}
var ROUTE1 = buildRoute([0.05, 0.15, 0.25, 0.35, 0.45, 0.55, 0.65, 0.75, 0.85, 0.95]);
function fmtPts(arr) { return arr.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); }
function splitRoute(pts, f) {
  var segs = [], total = 0, i;
  for (i = 1; i < pts.length; i++) {
    var d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    segs.push(d); total += d;
  }
  var target = Math.max(0, Math.min(1, f)) * total, acc = 0, pos = pts[pts.length - 1], cut = pts.length - 1;
  for (i = 0; i < segs.length; i++) {
    if (acc + segs[i] >= target) {
      var k = segs[i] ? (target - acc) / segs[i] : 0;
      pos = [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k];
      cut = i + 1; break;
    }
    acc += segs[i];
  }
  var done = pts.slice(0, cut).concat([pos]);
  var rest = [pos].concat(pts.slice(cut));
  return {
    done: fmtPts(done), rest: fmtPts(rest),
    x: pos[0].toFixed(1), y: pos[1].toFixed(1),
    lx: (pos[0] + 16).toFixed(1), ly: (pos[1] - 40).toFixed(1),
    tx: (pos[0] + 24).toFixed(1), ty: (pos[1] - 24).toFixed(1)
  };
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function clockAt(sec) {
  var s = Math.round(sec), h = 9 + Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return pad2(h) + ':' + pad2(m) + ':' + pad2(s % 60);
}
var TOTAL_SEC = 23 * 60, LIVE_T = 0.5;

class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () {
      var s = self.state || {};
      if (!s.playing) return;
      var t = (s.t == null ? LIVE_T : s.t) + 0.1 / (s.fast ? 10 : 30);
      if (t >= 1) { self.setState({ t: 1, playing: false }); return; }
      self.setState({ t: t });
    }, 100);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var self = this;
    var s = this.state || {};
    var t = s.t == null ? LIVE_T : s.t;
    var live = s.live == null ? true : s.live;
    var playing = !!s.playing;
    var lost = t >= 0.58 && t < 0.70;
    var eff = t < 0.58 ? t : (t < 0.70 ? 0.58 : t - 0.12);
    var f1 = Math.min(1, eff / 0.88);
    var d1 = splitRoute(ROUTE1, f1);
    var prog = f1;
    var el = t * TOTAL_SEC, remain = Math.max(0, TOTAL_SEC - el);
    var wob = Math.sin(t * 90);
    var rate = 3.5 + 0.1 * wob;
    var finished = t >= 1;
    var alerts = (t >= 0.3 ? 1 : 0) + (t >= 0.58 ? 1 : 0);
    return {
      ovl: !!s.ovl, satOn: s.ovl ? 'false' : 'true', ovlOn: s.ovl ? 'true' : 'false',
      satBorder: s.ovl ? 'transparent' : '#EF4122', satText: s.ovl ? '#FFFFFF' : '#EF4122',
      ovlBorder: s.ovl ? '#EF4122' : 'transparent', ovlText: s.ovl ? '#EF4122' : '#FFFFFF',
      pickSat: function () { self.setState({ ovl: false }); },
      pickOvl: function () { self.setState({ ovl: true }); },
      d1: d1,
      playing: playing, paused: !playing,
      playLabel: playing ? '일시정지' : '재생',
      tInt: Math.round(t * 1000),
      clockText: (live ? '실시간 · ' : '재생 · ') + clockAt(el),
      speedLabel: s.fast ? '빠르게' : '보통 속도',
      liveBg: live ? '#EF4122' : 'rgba(255,255,255,0.2)',
      missionBadge: finished ? 'success' : 'progress',
      missionLabel: finished ? '완료' : '작업중',
      linkColor: live ? (lost ? '#C0392B' : '#066B36') : '#475467',
      linkText: live ? (lost ? 'GCS 서버 로그 미수신 · ' + Math.round((t - 0.58) * TOTAL_SEC) + '초' : 'GCS 서버 수신 · 4초 지연 (10건 묶음)') : '기록 재생 중',
      kProg: String(Math.round(prog * 100)),
      kArea: Math.round(prog * 3025).toLocaleString('ko-KR') + ' / 3,025평',
      kSeed: (36.1 * prog * 1.01).toFixed(1),
      kElapsed: pad2(Math.floor(el / 60)) + ':' + pad2(Math.floor(el % 60)),
      kRemain: finished ? '작업 완료' : '예상 잔여 ' + Math.ceil(remain / 60) + '분',
      kAlerts: String(alerts),
      spd: (4.9 + 0.15 * Math.cos(t * 55)).toFixed(1),
      rate: rate.toFixed(1),
      rateW: (rate / 5 * 100).toFixed(0),
      rateDev: (rate >= 3.5 ? '+' : '') + ((rate / 3.5 - 1) * 100).toFixed(1) + '%',
      d1Badge: lost ? 'error' : (f1 >= 1 ? 'success' : 'progress'),
      d1Label: lost ? '통신 지연' : (f1 >= 1 ? '완료' : '작업중'),
      d1Sub: lost ? '운용 신OO · 마지막 수신 ' + Math.round((t - 0.58) * TOTAL_SEC) + '초 전' : '운용 신OO (농가) · 조종기',
      d1Ring: lost ? '#E76F00' : '#EF4122',
      d1LabelW: lost ? 104 : 50,
      d1LabelText: lost ? 'DR-01 · 통신 지연' : 'DR-01',
      d1LabelColor: lost ? '#C0392B' : '#0E1C31',
      spray: f1 >= 1 ? '종료' : (lost ? '확인 불가' : '살포 중'),
      sprayColor: f1 >= 1 ? '#475467' : (lost ? '#C0392B' : '#107C41'),
      remainKg: (40 - 36.1 * prog * 1.01).toFixed(1),
      showDeviation: t >= 0.3,
      devTime: clockAt(0.3 * TOTAL_SEC),
      showLost: t >= 0.58,
      lostSub: lost ? clockAt(0.58 * TOTAL_SEC) + ' · 위치 고정 표시 중' : clockAt(0.70 * TOTAL_SEC) + ' 통신 복구',
      togglePlay: function () {
        var cur = (self.state && self.state.t != null) ? self.state.t : LIVE_T;
        var on = !(self.state && self.state.playing);
        self.setState({ playing: on, live: false, t: on && cur >= 1 ? 0 : cur });
      },
      scrub: function (e) { self.setState({ t: Number(e.target.value) / 1000, live: false, playing: false }); },
      toggleSpeed: function () { self.setState({ fast: !(self.state && self.state.fast) }); },
      goLive: function () { self.setState({ t: LIVE_T, live: true, playing: false }); }
    };
  }
}
</script>
